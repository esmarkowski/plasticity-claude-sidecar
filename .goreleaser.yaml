# Release binaries so installing the module never needs a Go toolchain. plst
# prefers a release asset for exactly this reason.
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: sidecar
    main: ./cmd/plst-sidecar
    binary: plst-sidecar
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # Named os_arch, one of the spellings plst's asset matcher looks for.
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE*]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  prerelease: auto
